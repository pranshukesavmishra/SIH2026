[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fsoc-pat"
version = "0.1.0"
description = "Virtual camera tracking testbed for coarse alignment of mobile FSOC terminals (SIH 2026, PS SIH26169)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "opencv-python>=4.9", "PyYAML>=6.0"]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
